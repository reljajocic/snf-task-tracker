name: Weekly database backup

# Sundays 02:00 UTC, or by hand (Actions → Weekly database backup → Run workflow).
# The dump is encrypted before it leaves the runner: this repository is public, and anyone
# signed in to GitHub could download a plain artifact.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     Supabase → Connect → "Session pooler" URI, with the database password filled in
#   BACKUP_PASSPHRASE   a long random passphrase; keep it in your password manager (needed to restore)
#
# Restore: docs/backup.md
on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump, compress and encrypt
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "SUPABASE_DB_URL / BACKUP_PASSPHRASE not set; see the header of this file." >&2
            exit 1
          fi
          stamp=$(date -u +%Y-%m-%d)
          mkdir dump
          # Everything the app keeps (schema + data), and the sign-in accounts the profiles belong to.
          docker run --rm -e DB_URL -v "$PWD/dump:/dump" postgres:17 sh -c '
            set -e
            pg_dump "$DB_URL" --no-owner --no-privileges --schema=public -f /dump/public.sql
            pg_dump "$DB_URL" --no-owner --no-privileges --data-only --table=auth.users --table=auth.identities -f /dump/auth-users.sql
          '
          tar -C dump -czf - . | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$PASSPHRASE" -o "snf-db-$stamp.tar.gz.gpg"
          ls -lh "snf-db-$stamp.tar.gz.gpg"

      - name: Keep for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: snf-db-${{ github.run_number }}
          path: snf-db-*.tar.gz.gpg
          retention-days: 90
