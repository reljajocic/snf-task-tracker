name: Daily reminders

# 05:00 UTC = 07:00 in Belgrade (summer) / 06:00 (winter).
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    # Needs repo secrets APP_URL (e.g. https://app.slatenframe.com) and CRON_SECRET.
    steps:
      - name: Trigger reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET not configured yet; skipping."
            exit 0
          fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/reminders"
